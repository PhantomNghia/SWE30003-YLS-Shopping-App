<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin • Add Product</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <header>
    <h1>Admin • Add Product</h1>
    <nav><a href="/">← Back to shop</a></nav>
  </header>
 <!-- Main -->
    <main style="padding: 24px; max-width: 900px; margin: auto;">

    <!-- Product Create Form -->
    <form id="product-form" class="auth-container" style="max-width:560px; margin-bottom: 40px;">
        <h2>Create Product</h2>

        <label>Name <input name="name" required/></label>
        <label>Description <input name="description"/></label>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <label>Price <input name="price" type="number" step="0.01" required/></label>
        <label>Stock <input name="stock" type="number" min="0" required/></label>
        <label>Category (required)
          <select name="category" required>
            <option value="">-- Select --</option>
            <option value="specialty">Specialty</option>
            <option value="daily">Daily Necessities</option>
            <option value="none" selected>None</option>
          </select>
        </label>
        </div>

        <label>Image URL (optional) <input name="imageUrl" placeholder="https://..."/></label>

        <label>or Upload Image (optional)
        <input name="imageFile" type="file" accept="image/*"/>
        </label>

        <button type="submit">Add Product</button>
        <p id="status"></p>
    </form>

    <!-- Product List -->
    <h2>Existing Products</h2>
    <table id="product-table" border="1" style="width:100%; border-collapse:collapse; margin-top:16px;">
        <thead>
        <tr>
            <th>Name</th><th>Price</th><th>Stock</th><th>Image</th><th>Actions</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

    </main>

  <script type="module" src="/admin.js"></script>
</body>
</html>
