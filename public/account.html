<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Add Account Details</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><h1>Account details</h1></header>

  <main style="max-width:720px;margin:0 auto;padding:16px">
    <form id="acct-form" class="card">
      <label>Full name <input name="name" required></label>
      <label>Phone <input name="phone" required></label>
      <label>Address line <input name="line1" required></label>
      <label>City <input name="city" required></label>
      <label>Postcode <input name="postcode" required></label>
      <div style="margin-top:12px">
        <button type="submit">Save</button>
        <a href="/checkout.html" style="margin-left:8px">Cancel</a>
      </div>
      <p id="acct-status"></p>
    </form>
  </main>

  <script src="/auth.js"></script>
  <script src="/account.js"></script>
</body>
</html>
