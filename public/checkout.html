<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Checkout — Your Local Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/styles.css" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>Checkout</h1>
    <nav><a href="/index.html">← Continue shopping</a></nav>
  </header>

  <main id="checkout-root">
    <!-- Left: cart preview with images -->
    <section>
      <h2>Your items</h2>
      <div id="checkout-items"></div>

      <div class="totals">
        <div class="row"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
        <div class="row"><span>Shipping</span><strong id="shipping">$0.00</strong></div>
        <div class="row"><span>Tax (10% GST)</span><strong id="tax">$0.00</strong></div>
        <div class="row total"><span>Total</span><strong id="grand-total">$0.00</strong></div>
      </div>
    </section>

    <!-- Right: shipping/contact form + submit -->
    <section id="checkout-pane">
      <form id="checkout-form" autocomplete="on">
        <h3>Shipping details</h3>
        <div class="grid2">
          <label>Full name<input name="name" required></label>
          <label>Phone<input name="phone" required></label>
        </div>
        <label>Address line 1<input name="line1" required></label>
        <label>Address line 2<input name="line2"></label>
        <div class="grid3">
          <label>City<input name="city" required></label>
          <label>State<input name="state"></label>
          <label>Postcode<input name="postcode" required></label>
        </div>
        <button id="place-order" type="submit" class="btn-primary">Place order & pay</button>
        <p id="checkout-status" class="muted"></p>
      </form>

      <!-- Order tracker & receipt (shown after success) -->
      <section id="order-tracker" hidden>
        <div id="order-status"></div>
        <div id="shipment-status"></div>
        <div id="receipt"></div>
        <div id="stats"></div>
      </section>
    </section>
  </main>

  <script src="/checkout.js" defer></script>
</body>
</html>
